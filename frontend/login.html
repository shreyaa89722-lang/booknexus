<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNexus — Log in</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="logo-header">
      <h1>BookNexus</h1>
      <p>A campus book exchange — sign in to continue</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@university.edu" />
        <div class="hint" id="emailHint"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" />
        <div class="hint" id="passwordHint"></div>
      </div>
      <div class="error-banner" id="formError"></div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Log in</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
  <script src="js/app.js"></script>
  <script>
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const emailHint = document.getElementById("emailHint");
    const passwordHint = document.getElementById("passwordHint");
    const formError = document.getElementById("formError");
    const submitBtn = document.getElementById("submitBtn");

    function validate() {
      const e = email.value.trim();
      const p = password.value;
      emailHint.textContent = !e ? "Email is required" : (BN.isEmail(e) ? "" : "Enter a valid email address");
      emailHint.className = "hint " + (emailHint.textContent ? "bad" : "");
      passwordHint.textContent = !p ? "Password is required" : "";
      passwordHint.className = "hint " + (passwordHint.textContent ? "bad" : "");
      return BN.isEmail(e) && p.length > 0;
    }

    email.addEventListener("input", validate);
    password.addEventListener("input", validate);

    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      formError.textContent = "";
      if (!validate()) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      try {
        const json = await BN.api("/auth/login", {
          method: "POST",
          auth: false,
          body: { email: email.value.trim(), password: password.value },
        });
        BN.setSession(json.data);
        formError.style.color = "#166534";
        formError.textContent = "Welcome back — redirecting…";
        setTimeout(() => BN.afterLogin(json.data), 500);
      } catch (err) {
        formError.style.color = "#b45309";
        formError.textContent = err.message || "Invalid email or password";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
