<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNexus — Admin Analytics</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="app-body">
  <nav class="topnav" id="appNav"></nav>
  <div class="mobile-menu" id="mobileMenu"></div>
  <main class="page">
    <div class="page-head row space">
      <div>
        <h1>Admin dashboard</h1>
        <p>Circulation across the catalog.</p>
      </div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="charts-grid">
      <div class="panel" style="padding:20px"><h2>Genre distribution</h2><div id="genreBars"></div></div>
      <div class="panel" style="padding:20px"><h2>Rental status</h2><canvas id="statusChart"></canvas></div>
      <div class="panel" style="padding:20px"><h2>30-day rental trend</h2><canvas id="trendChart"></canvas></div>
      <div class="panel" style="padding:20px"><h2>User growth</h2><canvas id="growthChart"></canvas></div>
    </div>
    <div class="panel" style="padding:20px;margin-top:16px">
      <h2>Most rented books</h2>
      <table><thead><tr><th>Title</th><th>Author</th><th>Rentals</th></tr></thead><tbody id="topBooks"></tbody></table>
    </div>
    <div class="panel" style="padding:20px;margin-top:16px">
      <h2 style="color:var(--rust)">Overdue books</h2>
      <table><thead><tr><th>Book</th><th>Renter</th><th>Contact</th><th>Due</th></tr></thead><tbody id="overdue"></tbody></table>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    const user = BN.requireAuth();
    if (user.role !== "admin") window.location.href = "browse.html";
    BN.renderNav("admin");
    const charts = {};

    function line(id, labels, data, color) {
      if (charts[id]) charts[id].destroy();
      charts[id] = new Chart(document.getElementById(id), {
        type: "line",
        data: { labels: labels.length ? labels : ["No data"], datasets: [{ data: data.length ? data : [0], borderColor: color, backgroundColor: color + "22", fill: true, tension: 0.3 }] },
        options: { responsive: true, plugins: { legend: { display: false } } },
      });
    }

    async function load() {
      const json = await BN.api("/analytics/overview");
      const d = json.data;
      const byStatus = Object.fromEntries((d.rentalsByStatus || []).map((s) => [s._id, s.count]));
      const totalRentals = (d.rentalsByStatus || []).reduce((n, s) => n + s.count, 0);
      document.getElementById("stats").innerHTML = `
        <div class="stat-card"><div class="label">Books</div><div class="value">${d.totalBooks || 0}</div></div>
        <div class="stat-card"><div class="label">Users</div><div class="value">${d.totalUsers || 0}</div></div>
        <div class="stat-card"><div class="label">Active rentals</div><div class="value">${byStatus.active || 0}</div></div>
        <div class="stat-card"><div class="label">Total rentals</div><div class="value">${totalRentals}</div></div>
        <div class="stat-card"><div class="label">Active users 30d</div><div class="value">${d.activeUsersCount || 0}</div></div>
        <div class="stat-card"><div class="label">Overdue</div><div class="value" style="color:var(--rust)">${d.overdueRentalsCount || 0}</div></div>
      `;
      const maxG = Math.max(1, ...(d.genreDistribution || []).map((g) => g.count));
      document.getElementById("genreBars").innerHTML = (d.genreDistribution || []).map((g) => `
        <div class="bar-row"><span style="width:120px">${g._id}</span><div class="track"><div class="fill" style="width:${(g.count / maxG) * 100}%"></div></div><span>${g.count}</span></div>
      `).join("") || BN.empty("No genre data.");

      if (charts.status) charts.status.destroy();
      charts.status = new Chart(document.getElementById("statusChart"), {
        type: "doughnut",
        data: {
          labels: (d.rentalsByStatus || []).map((s) => s._id),
          datasets: [{ data: (d.rentalsByStatus || []).map((s) => s.count), backgroundColor: ["#b07d4f", "#4a6b53", "#9b3d3d", "#3b6ea8", "#888"] }],
        },
      });
      line("trendChart", (d.rentalTrends || []).map((x) => x._id), (d.rentalTrends || []).map((x) => x.count), "#b07d4f");
      line("growthChart", (d.userGrowth || []).map((x) => x._id), (d.userGrowth || []).map((x) => x.count), "#3b6ea8");

      document.getElementById("topBooks").innerHTML = (d.mostRentedBooks || []).length
        ? d.mostRentedBooks.map((item) => `<tr><td>${item.book?.title || ""}</td><td>${item.book?.author || ""}</td><td>${item.rentalCount}</td></tr>`).join("")
        : `<tr><td colspan="3" class="muted">No rental data yet</td></tr>`;

      document.getElementById("overdue").innerHTML = (d.overdueRentals || []).length
        ? d.overdueRentals.map((r) => `<tr><td>${r.book?.title || ""}</td><td>${r.renter?.name || ""}</td><td>${r.renter?.email || ""}</td><td>${BN.formatDate(r.dueDate)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="muted">No overdue rentals</td></tr>`;
    }

    document.getElementById("refreshBtn").addEventListener("click", () => load().catch((e) => BN.toast(e.message)));
    load().catch((err) => BN.toast(err.message));
  </script>
</body>
</html>
