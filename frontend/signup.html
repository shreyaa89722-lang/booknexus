<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNexus — Create account</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="logo-header">
      <h1>BookNexus</h1>
      <p>Create your account</p>
    </div>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name" placeholder="Alex Rivera" />
        <div class="hint" id="nameHint"></div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@university.edu" />
        <div class="hint" id="emailHint"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters" />
        <div class="hint" id="passwordHint"></div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" />
        <div class="hint" id="confirmHint"></div>
      </div>
      <div class="field">
        <label>I am a</label>
        <div class="role-row">
          <button type="button" class="role-opt active" data-role="student">Student</button>
          <button type="button" class="role-opt" data-role="owner">Book Owner</button>
        </div>
      </div>
      <div class="error-banner" id="formError"></div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Create account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>
  <script src="js/app.js"></script>
  <script>
    let role = "student";
    document.querySelectorAll(".role-opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        role = btn.dataset.role;
        document.querySelectorAll(".role-opt").forEach((b) => b.classList.toggle("active", b === btn));
      });
    });

    const name = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirm");

    function live() {
      const n = name.value.trim();
      const e = email.value.trim();
      const p = password.value;
      const c = confirm.value;
      setHint("nameHint", n ? "" : "Name is required", !n);
      if (!e) setHint("emailHint", "Enter a valid email format", true);
      else setHint("emailHint", BN.isEmail(e) ? "Looks like a valid email" : "Enter a valid email format", !BN.isEmail(e));
      if (!p) setHint("passwordHint", "Password must be at least 6 characters", true);
      else setHint("passwordHint", p.length >= 6 ? "Password length looks good" : "Password must be at least 6 characters", p.length < 6);
      if (!c) setHint("confirmHint", "Re-enter your password", true);
      else setHint("confirmHint", c === p ? "Passwords match" : "Passwords do not match", c !== p);
      return n && BN.isEmail(e) && p.length >= 6 && c === p;
    }

    function setHint(id, text, bad) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "hint " + (text ? (bad ? "bad" : "ok") : "");
    }

    [name, email, password, confirm].forEach((el) => el.addEventListener("input", live));

    document.getElementById("signupForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const formError = document.getElementById("formError");
      const submitBtn = document.getElementById("submitBtn");
      formError.textContent = "";
      if (!live()) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";
      try {
        const json = await BN.api("/auth/register", {
          method: "POST",
          auth: false,
          body: { name: name.value.trim(), email: email.value.trim(), password: password.value, role },
        });
        BN.setSession(json.data);
        formError.style.color = "#166534";
        formError.textContent = "Account created — redirecting…";
        setTimeout(() => BN.afterLogin(json.data), 500);
      } catch (err) {
        formError.style.color = "#b45309";
        formError.textContent = err.message || "Could not create account";
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
