<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHive Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #e8eef5 0%, #dce4f0 25%, #f7efe6 50%, #e8f0fb 75%);
      background-size: 400% 400%;
      animation: gradientShift 14s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-card {
      width: 380px;
      padding: 45px 40px 40px;
      background: linear-gradient(135deg, rgba(176,125,79,0.10), rgba(255,255,255,0.04));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      border: 1px solid rgba(176,125,79,0.18);
      box-shadow: 
        12px 12px 30px rgba(176,125,79,0.08),
        -12px -12px 30px rgba(255, 255, 255, 0.8),
        inset 2px 2px 6px rgba(255, 255, 255, 0.25);
      position: relative;
      transform-origin: center;
      transition: transform 0.35s cubic-bezier(.2,.9,.3,1), box-shadow 0.35s;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .login-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 24px 24px 50px rgba(176,125,79,0.10), -18px -18px 40px rgba(255,255,255,0.9);
    }

    .logo-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #7c4d25;
      letter-spacing: -0.5px;
    }

    .logo-header p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .field {
      margin-bottom: 22px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
      font-weight: 500;
      opacity: 0.95;
    }

    input {
      width: 100%;
      padding: 14px 20px;
      padding-right: 48px;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 
        inset 2px 2px 5px rgba(0, 0, 0, 0.06),
        inset -2px -2px 5px rgba(255, 255, 255, 0.6);
      font-size: 15px;
      color: #374151;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 0 0 2px rgba(176, 125, 79, 0.3),
        inset 2px 2px 4px rgba(0, 0, 0, 0.05);
      transform: translateY(-1px);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 38px;
      background: transparent;
      border: none;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(55,65,81,0.8);
    }

    .toggle-pass svg { width: 18px; height: 18px; }

    .error-msg {
      font-size: 12px;
      color: #dc2626;
      margin-top: 6px;
      padding-left: 14px;
      min-height: 16px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #b07d4f 0%, #c0915b 50%, #b07d4f 100%);
      background-size: 200% 100%;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 6px 6px 18px rgba(176, 125, 79, 0.32), -4px -4px 12px rgba(255, 255, 255, 0.5);
      transition: all 0.32s cubic-bezier(.2,.9,.3,1);
    }

    .btn:hover:not(:disabled) {
      background-position: 100% 0;
      transform: translateY(-3px) scale(1.01);
      box-shadow: 12px 12px 30px rgba(176, 125, 79, 0.38), -6px -6px 18px rgba(255,255,255,0.6);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-header">
      <h1>BookHive</h1>
      <p>Sign in to your account</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="100" placeholder="admin@bookhive.test" autocomplete="username">
        <div class="error-msg" id="emailError" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" maxlength="50" placeholder="Enter password" autocomplete="current-password">
        <button type="button" class="toggle-pass" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="error-msg" id="passwordError" aria-live="polite"></div>
      </div>

      <div class="error-msg" id="loginError" aria-live="polite" style="margin-bottom:12px; text-align:center; font-weight:500;"></div>

      <button class="btn" id="loginBtn" type="submit" disabled>View Dashboard</button>
    </form>
  </div>

<script>
  (function(){
    const emailInput = document.getElementById('email');
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.querySelector('.toggle-pass');
    const loginBtn = document.getElementById('loginBtn');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const loginError = document.getElementById('loginError');
    const form = document.getElementById('loginForm');

    function trimVal(el){ if(!el) return ''; return el.value.trim(); }

    function isEmailValid(v){
      if(!v) return false;
      if(v.length > 100) return false;
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(v);
    }

    function isPasswordValid(v){
      if(!v) return false;
      return v.length >= 6;
    }

    function updateErrors(){
      const email = trimVal(emailInput);
      const pwd = trimVal(pwdInput);

      if(!email){
        emailError.textContent = 'Email is required';
      } else if(!isEmailValid(email)){
        emailError.textContent = 'Enter a valid email address';
      } else {
        emailError.textContent = '';
      }

      if(!pwd){
        passwordError.textContent = 'Password is required';
      } else if(!isPasswordValid(pwd)){
        passwordError.textContent = 'Password must be at least 6 characters';
      } else {
        passwordError.textContent = '';
      }

      const bothValid = isEmailValid(email) && isPasswordValid(pwd);
      loginBtn.disabled = !bothValid;
      if(!bothValid) loginError.textContent = '';
    }

    [emailInput, pwdInput].forEach(inp => {
      if(!inp) return;
      inp.addEventListener('input', updateErrors);
      inp.addEventListener('blur', updateErrors);
    });

    if(toggleBtn && pwdInput){
      let visible = false;
      toggleBtn.addEventListener('click', function(){
        visible = !visible;
        pwdInput.type = visible ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
        toggleBtn.innerHTML = visible ? `
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>` : `
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`;
      });
    }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      updateErrors();
      const email = trimVal(emailInput);
      const pwd = trimVal(pwdInput);
      if(!isEmailValid(email) || !isPasswordValid(pwd)){
        loginError.textContent = '';
        return;
      }

      try {
        loginBtn.disabled = true;
        loginError.style.color = '#1d4ed8';
        loginError.textContent = 'Connecting to backend...';

        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pwd })
        });
        const json = await res.json();

        if (!json.success) throw new Error(json.message || 'Login failed');

        localStorage.setItem('bookhive_token', json.data.token);
        localStorage.setItem('bookhive_user', JSON.stringify(json.data));

        loginError.style.color = '#065f46';
        loginError.textContent = 'Login successful — redirecting...';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);

      } catch (err) {
        loginBtn.disabled = false;
        loginError.style.color = '#b45309';
        loginError.textContent = err.message || 'Incorrect email or password';
      }
    });

    updateErrors();
  })();
</script>
</body>
</html>
