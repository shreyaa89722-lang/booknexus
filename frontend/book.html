<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNexus — Book details</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">
  <nav class="topnav" id="appNav"></nav>
  <div class="mobile-menu" id="mobileMenu"></div>
  <main class="page" id="content"></main>
  <script src="js/app.js"></script>
  <script>
    const user = BN.requireAuth();
    BN.renderNav("browse");
    const id = new URLSearchParams(location.search).get("id");
    const content = document.getElementById("content");

    function isOwn(book) {
      const ownerId = book.owner?._id || book.owner;
      return ownerId && user && String(ownerId) === String(user._id);
    }

    async function load() {
      if (!id) {
        content.innerHTML = BN.empty("Missing book id.");
        return;
      }
      try {
        const json = await BN.api(`/books/${id}`, { auth: false });
        render(json.data);
      } catch (err) {
        content.innerHTML = BN.empty(err.message);
      }
    }

    function render(book) {
      const avail = book.availability === "available";
      const own = isOwn(book);
      const disabled = !avail || own;
      let cta = "Request to Rent";
      if (own) cta = "This is your listing";
      else if (!avail) cta = "Currently unavailable";
      content.innerHTML = `
        <button class="btn btn-ghost btn-sm" onclick="history.back()">← Back</button>
        <div class="list-card" style="margin-top:18px;grid-template-columns:220px 1fr;align-items:start">
          <div class="cover" style="height:300px;border-radius:12px;${BN.coverStyle(book)}">${book.coverUrl ? `<img src="${book.coverUrl}" alt="">` : ""}</div>
          <div>
            <span class="badge b-lib">${book.genre || ""}</span>
            <h1 style="margin:8px 0 4px;color:var(--rosewood)">${book.title}</h1>
            <p class="muted">${book.author}${book.subject ? " · " + book.subject : ""}</p>
            <div class="row" style="margin:14px 0">
              <span class="badge ${avail ? "b-avail" : "b-out"}">${book.availability}</span>
              <span class="badge ${book.listingType === "p2p" ? "b-p2p" : "b-lib"}">${book.listingType === "p2p" ? "P2P" : "Library"}</span>
            </div>
            <p style="margin-bottom:12px">${book.description || "No description yet."}</p>
            <p class="muted">Condition: ${book.condition || "good"}</p>
            ${book.listingType === "p2p" ? `<p style="margin-top:8px">Owner: <strong>${book.owner?.name || "Unknown"}</strong> · $${book.rentalPricePerWeek || 0}/week</p>` : ""}
            <div id="confirm" class="success" style="margin:12px 0"></div>
            <button class="btn btn-primary" style="width:auto;margin-top:12px" id="rentBtn" ${disabled ? "disabled" : ""}>${cta}</button>
          </div>
        </div>
      `;
      document.getElementById("rentBtn")?.addEventListener("click", async () => {
        const btn = document.getElementById("rentBtn");
        btn.disabled = true;
        btn.textContent = "Sending request…";
        try {
          await BN.api("/rentals", { method: "POST", body: { bookId: book._id } });
          document.getElementById("confirm").textContent = "Request sent. The owner (or admin) will review it.";
          btn.textContent = "Request sent";
          BN.toast("Rental request submitted");
        } catch (err) {
          document.getElementById("confirm").style.color = "#9b3d3d";
          document.getElementById("confirm").textContent = err.message;
          btn.disabled = disabled;
          btn.textContent = cta;
        }
      });
    }

    load();
  </script>
</body>
</html>
