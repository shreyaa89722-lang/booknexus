<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookNexus — Browse</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">
  <nav class="topnav" id="appNav"></nav>
  <div class="mobile-menu" id="mobileMenu"></div>
  <main class="page">
    <div class="page-head">
      <h1>Browse books</h1>
      <p>Search the campus library and peer-to-peer listings.</p>
    </div>
    <div class="filters">
      <input id="q" placeholder="Search title, author, genre, or subject" />
      <select id="genre">
        <option value="">All genres</option>
      </select>
      <select id="listingType">
        <option value="">All listing types</option>
        <option value="library">Library</option>
        <option value="p2p">P2P</option>
      </select>
      <label class="toggle"><input type="checkbox" id="availOnly" /> Available only</label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>
  <script src="js/app.js"></script>
  <script>
    BN.requireAuth();
    BN.renderNav("browse");
    const grid = document.getElementById("grid");
    let page = 1;
    const limit = 12;

    async function loadGenres() {
      try {
        const json = await BN.api("/books?limit=100", { auth: false });
        const genres = [...new Set((json.data || []).map((b) => b.genre).filter(Boolean))].sort();
        const sel = document.getElementById("genre");
        genres.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g; opt.textContent = g;
          sel.appendChild(opt);
        });
      } catch {}
    }

    async function load() {
      grid.innerHTML = BN.skeletons();
      const params = new URLSearchParams({ page, limit });
      const q = document.getElementById("q").value.trim();
      const genre = document.getElementById("genre").value;
      const listingType = document.getElementById("listingType").value;
      if (q) params.set("q", q);
      if (genre) params.set("genre", genre);
      if (listingType) params.set("listingType", listingType);
      if (document.getElementById("availOnly").checked) params.set("availability", "available");
      try {
        const json = await BN.api(`/books?${params}`, { auth: false });
        const books = json.data || [];
        grid.innerHTML = books.length ? books.map(BN.bookCard).join("") : BN.empty("No books match those filters. Try a broader search.");
        const pages = json.pagination?.pages || 1;
        document.getElementById("pager").innerHTML = pages > 1 ? `
          <button class="btn btn-ghost btn-sm" ${page <= 1 ? "disabled" : ""} id="prevPage">Previous</button>
          <span class="muted">Page ${json.pagination.page} of ${pages}</span>
          <button class="btn btn-ghost btn-sm" ${page >= pages ? "disabled" : ""} id="nextPage">Next</button>
        ` : "";
        document.getElementById("prevPage")?.addEventListener("click", () => { page -= 1; load(); });
        document.getElementById("nextPage")?.addEventListener("click", () => { page += 1; load(); });
      } catch (err) {
        grid.innerHTML = BN.empty(err.message);
      }
    }

    ["q", "genre", "listingType", "availOnly"].forEach((id) => {
      document.getElementById(id).addEventListener("change", () => { page = 1; load(); });
    });
    document.getElementById("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { page = 1; load(); }
    });

    loadGenres();
    load();
  </script>
</body>
</html>
